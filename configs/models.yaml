# Model and provider per role. Prices are Adaption credits per 1M tokens
# (1 credit is treated as 1 USD in cost reports).
providers:
  adaption:
    base_url: https://api.prod.adaptionlabs.ai/api/v1
    api_key_env: ADAPTION_API_KEY
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY

roles:
  attacker:        {provider: adaption, model: qwen3.5-397b}   # red team (different family from Tier 2 judge)
  validator:       {provider: adaption, model: deepseek-v4-flash}
  reporter:        {provider: adaption, model: deepseek-v4-flash} # neutral final reports when missing
  tier1:           {provider: adaption, model: deepseek-v4-flash} # cheap say-vs-do check
  tier2:           {provider: adaption, model: glm-5.2}           # strong full-trajectory judge

prices:   # credits per 1M tokens: input, cached input, output
  gemma-4-31b-it:                     {input: 0.09,  cached: 0.05,   output: 0.34}
  glm-5.2:                            {input: 1.40,  cached: 0.26,   output: 4.40}
  qwen3.5-397b:                       {input: 0.55,  cached: 0.23,   output: 3.50}
  gemma-4-26b-a4b-it:                 {input: 0.077, cached: 0.043,  output: 0.26}
  qwen3.8-27b:                        {input: 0.039, cached: 0.0039, output: 1.25}
  deepseek-v4-flash:                  {input: 0.045, cached: 0.0015, output: 0.14}
  glm-5.3-flash:                      {input: 0.15,  cached: 0.03,   output: 0.50}
  nemotron-SEA-LION-v4.8-120b-a12b:   {input: 0.08,  cached: 0.016,  output: 0.45}
  qwen-SEA-LION-v5-397b-a17b-plus:    {input: 0.55,  cached: 0.23,   output: 3.50}
